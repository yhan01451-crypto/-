<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>두근두근 예민의 진급</title>
    <style>
        :root {
            --bg-color: #121318;
            --gameboy-body: #92a1b9;
            --screen-border: #3b424d;
            --screen-bg: #9bbc0f;
            --pixel-dark: #0f380f;
            --btn-red: #e74c3c;
            --btn-dark: #2c3e50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; overflow: hidden; }

        .gameboy-container {
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            max-height: 840px;
            background: var(--gameboy-body);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            border: 4px solid #6c7a92;
            position: relative;
        }

        .star-bar {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 14px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            z-index: 20;
        }

        .screen-frame {
            width: 100%;
            height: 52%;
            background: var(--screen-border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
            position: relative;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            color: #aebbc9;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            background-color: var(--screen-bg);
            border: 3px solid #304510;
            border-radius: 4px;
            image-rendering: pixelated;
        }

        /* 픽셀 대화창 Overlay */
        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: #f8f9fa;
            border: 3px solid #0f380f;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            color: #0f380f;
            font-weight: bold;
            line-height: 1.4;
            display: none;
            box-shadow: 3px 3px 0px #0f380f;
            z-index: 30;
        }

        .controller-area {
            width: 100%;
            height: 42%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 20px 10px;
        }

        /* 십자키 (D-PAD) */
        .dpad {
            width: 130px;
            height: 130px;
            position: relative;
        }
        .dpad-btn {
            position: absolute;
            background: var(--btn-dark);
            border: 2px solid #1a252f;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.2);
            cursor: pointer;
        }
        .dpad-btn:active { background: #415b76; }
        .dpad-up { top: 0; left: 43px; width: 44px; height: 45px; border-radius: 6px 6px 0 0; }
        .dpad-down { bottom: 0; left: 43px; width: 44px; height: 45px; border-radius: 0 0 6px 6px; }
        .dpad-left { top: 43px; left: 0; width: 45px; height: 44px; border-radius: 6px 0 0 6px; }
        .dpad-right { top: 43px; right: 0; width: 45px; height: 44px; border-radius: 0 6px 6px 0; }
        .dpad-center { top: 43px; left: 43px; width: 44px; height: 44px; background: var(--btn-dark); }

        /* A 버튼 */
        .action-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 15px;
        }
        .btn-a {
            width: 78px;
            height: 78px;
            background: var(--btn-red);
            border-radius: 50%;
            border: 3px solid #922b21;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 0 #641e16, inset 0 2px 4px rgba(255,255,255,0.3);
            cursor: pointer;
        }
        .btn-a:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #641e16;
        }
    </style>
</head>
<body>

<div class="gameboy-container">
    <div class="star-bar" id="star-display">⭐ x 0</div>
    <div class="screen-frame">
        <div class="screen-header">
            <span>RETRO GAMEBOY COLOR</span>
            <span>BATTERY ▮▮▮</span>
        </div>
        <canvas id="game-canvas" width="240" height="240"></canvas>
        <div id="dialog" class="dialog-box">
            <div id="dialog-text">대화 내용이 출력됩니다.</div>
            <div style="text-align: right; font-size: 9px; color: #7f8c8d; margin-top: 4px;">[A 버튼으로 계속]</div>
        </div>
    </div>

    <!-- 컨트롤러 -->
    <div class="controller-area">
        <div class="dpad">
            <div class="dpad-btn dpad-up" onclick="handleInput('UP')"></div>
            <div class="dpad-btn dpad-down" onclick="handleInput('DOWN')"></div>
            <div class="dpad-btn dpad-left" onclick="handleInput('LEFT')"></div>
            <div class="dpad-btn dpad-right" onclick="handleInput('RIGHT')"></div>
            <div class="dpad-center"></div>
        </div>
        <div class="action-area">
            <div class="btn-a" onclick="handleInput('A')">A</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const dialogBox = document.getElementById('dialog');
    const dialogText = document.getElementById('dialog-text');
    const starDisplay = document.getElementById('star-display');

    let gameState = {
        stage: 0,
        stars: 0,
        player: { x: 110, y: 110 },
        partner: { x: 90, y: 110 },
        dialogIndex: 0,
        dialogList: [],
        endingStep: 0
    };

    function loadGame() {
        const saved = localStorage.getItem('yemin_game_save');
        if (saved) {
            const data = JSON.parse(saved);
            gameState.stage = data.stage || 0;
            gameState.stars = data.stars || 0;
            updateStarDisplay();
        }
    }

    function saveGame() {
        localStorage.setItem('yemin_game_save', JSON.stringify({
            stage: gameState.stage,
            stars: gameState.stars
        }));
    }

    function updateStarDisplay() {
        starDisplay.innerText = `⭐ x ${gameState.stars}`;
    }

    function playBeep(freq = 440, type = 'square', duration = 0.05) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function showDialog(lines, onComplete) {
        gameState.dialogList = lines;
        gameState.dialogIndex = 0;
        gameState.onDialogComplete = onComplete;
        dialogText.innerText = gameState.dialogList[0];
        dialogBox.style.display = 'block';
    }

    function handleInput(type) {
        playBeep(type === 'A' ? 520 : 280);

        if (dialogBox.style.display === 'block') {
            if (type === 'A') {
                gameState.dialogIndex++;
                if (gameState.dialogIndex < gameState.dialogList.length) {
                    dialogText.innerText = gameState.dialogList[gameState.dialogIndex];
                } else {
                    dialogBox.style.display = 'none';
                    if (gameState.onDialogComplete) gameState.onDialogComplete();
                }
            }
            return;
        }

        switch(gameState.stage) {
            case 0:
                if (type === 'A') startStage1();
                break;
            case 1:
                if (type === 'A') {
                    gameState.player.x += 6;
                    if (gameState.player.x >= 170) finishStage1();
                }
                break;
            case 2:
                movePlayer(type);
                if (type === 'A') checkCabinetItem();
                break;
            case 3:
                movePlayer(type);
                if (type === 'A') checkQuizAnswer();
                break;
            case 4:
                movePlayer(type);
                if (type === 'A') checkPlayground();
                break;
            case 5:
                movePlayer(type);
                gameState.partner.x = gameState.player.x - 18;
                gameState.partner.y = gameState.player.y;
                if (type === 'A') checkIceRink();
                break;
            case 6:
                if (type === 'A') advanceEnding();
                break;
        }
    }

    function movePlayer(type) {
        const speed = 12;
        if (type === 'UP' && gameState.player.y > 20) gameState.player.y -= speed;
        if (type === 'DOWN' && gameState.player.y < 200) gameState.player.y += speed;
        if (type === 'LEFT' && gameState.player.x > 20) gameState.player.x -= speed;
        if (type === 'RIGHT' && gameState.player.x < 200) gameState.player.x += speed;
    }

    // --- STAGE FLOW ---

    function startStage1() {
        gameState.stage = 1;
        gameState.player = { x: 20, y: 120 };
        showDialog(["상병 진급 축하해! 🎖️", "예서와의 소중한 추억의 별 5개를 모아야 해!", "STAGE 1: A버튼을 마구 연타해서 한강 오리배를 저어가자!"]);
    }

    function finishStage1() {
        gameState.stars = 1;
        updateStarDisplay();
        saveGame();
        showDialog([
            "우리 작년에 한강에서",
            "오리배 탈때",
            "오빠가 노래 불러준거 기억 나?",
            "너무너무 행복했어 🎵",
            "⭐ 첫 번째 별 획득!"
        ], () => startStage2());
    }

    function startStage2() {
        gameState.stage = 2;
        gameState.player = { x: 40, y: 180 };
        showDialog(["STAGE 2: 관물대에서 추억의 물건 '명찰'을 찾아봐!"]);
    }

    function checkCabinetItem() {
        if (Math.abs(gameState.player.x - 180) < 30 && Math.abs(gameState.player.y - 60) < 30) {
            gameState.stars = 2;
            updateStarDisplay();
            saveGame();
            showDialog(["우리의 소중한 '명찰'을 찾았다!", "⭐ 두 번째 별 획득!"], () => startStage3());
        } else {
            showDialog(["복권, 에어팟, 패딩이 있네.", "'명찰'은 어디 있을까?"]);
        }
    }

    function startStage3() {
        gameState.stage = 3;
        gameState.player = { x: 110, y: 180 };
        showDialog(["STAGE 3: 우리의 첫 데이트 장소 발판으로 이동해서 A버튼을 눌러!"]);
    }

    function checkQuizAnswer() {
        if (gameState.player.x > 120 && gameState.player.y < 90) {
            gameState.stars = 3;
            updateStarDisplay();
            saveGame();
            showDialog(["정답! 우리의 첫 데이트 장소는 '야탑'! 💖", "⭐ 세 번째 별 획득!"], () => startStage4());
        } else {
            showDialog(["땡! 다시 생각해봐~ 😜"]);
        }
    }

    function startStage4() {
        gameState.stage = 4;
        gameState.player = { x: 30, y: 30 };
        showDialog(["STAGE 4: 둘만 아는 특별한 장소 '서희 놀이터'를 찾아가자!"]);
    }

    function checkPlayground() {
        if (Math.abs(gameState.player.x - 120) < 30 && Math.abs(gameState.player.y - 120) < 30) {
            gameState.stars = 4;
            updateStarDisplay();
            saveGame();
            showDialog(["둘만 아는 장소, '서희 놀이터' 발견!", "⭐ 네 번째 별 획득!"], () => startStage5());
        } else {
            showDialog(["가로등과 벤치가 있어. 놀이터 기구 쪽으로 가보자!"]);
        }
    }

    function startStage5() {
        gameState.stage = 5;
        gameState.player = { x: 60, y: 120 };
        gameState.partner = { x: 42, y: 120 };
        showDialog(["STAGE 5: 예서와 함께 아이스링크장 중앙으로 가서 A버튼을 눌러!"]);
    }

    function checkIceRink() {
        if (Math.abs(gameState.player.x - 180) < 30) {
            gameState.stars = 5;
            updateStarDisplay();
            saveGame();
            showDialog([
                "손 꼭 잡고 탈때 진짜 재미있었는데!",
                "기억에 남는 아이스링크장 데이트 완성! ⛸️",
                "⭐ 마지막 다섯 번째 별 획득!"
            ], () => startEnding());
        }
    }

    function startEnding() {
        gameState.stage = 6;
        gameState.endingStep = 0;
        advanceEnding();
    }

    function advanceEnding() {
        const credits = [
            "9개월동안 너무 고생 많았어",
            "조금만 더 힘내서 꽃길 걷자!",
            "상병된거 너무 축하해",
            "✨ 사랑해! ✨"
        ];

        if (gameState.endingStep < credits.length) {
            showDialog([credits[gameState.endingStep]]);
            gameState.endingStep++;
        } else {
            showDialog(["🎉 게임을 모두 마쳤습니다! 🎉", "[다시 시작하려면 새로고침 해주세요]"]);
        }
    }

    // --- RENDER ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function drawCharacter(x, y, isYemin = true) {
        // 머리
        drawPixelRect(x+4, y, 8, 4, isYemin ? '#0f380f' : '#8b4513'); 
        // 얼굴
        drawPixelRect(x+2, y+4, 12, 6, '#f3c699'); 
        // 옷 (예민: 빨간 옷 / 예서: 핑크 옷)
        drawPixelRect(x+2, y+10, 12, 6, isYemin ? '#d32f2f' : '#e91e63'); 
    }

    function render() {
        ctx.fillStyle = '#9bbc0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        switch(gameState.stage) {
            case 0:
                ctx.fillStyle = '#0f380f';
                ctx.font = '12px monospace';
                ctx.fillText("두근두근 예민의 진급", 45, 80);
                ctx.fillText("남자친구 상병진급 기념", 40, 110);
                ctx.fillText("[ A 버튼을 누르세요 ]", 45, 160);
                drawCharacter(110, 125, true);
                break;

            case 1:
                drawPixelRect(0, 0, 240, 240, '#8bac0f');
                drawPixelRect(gameState.player.x, gameState.player.y, 28, 18, '#0f380f');
                drawPixelRect(gameState.player.x+18, gameState.player.y-6, 8, 8, '#304510');
                drawCharacter(gameState.player.x+4, gameState.player.y+2, true);
                ctx.fillStyle = '#0f380f';
                ctx.font = '11px monospace';
                ctx.fillText("A버튼 연타!! 🛶", 80, 40);
                break;

            case 2:
                drawPixelRect(170, 40, 35, 45, '#304510');
                drawPixelRect(30, 40, 35, 45, '#304510');
                ctx.fillStyle = '#0f380f';
                ctx.font = '10px monospace';
                ctx.fillText("[관물대 탐색]", 80, 30);
                drawCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 3:
                ctx.fillStyle = '#304510';
                ctx.font = '10px monospace';
                ctx.fillText("Q. 우리의 첫 데이트 장소는?", 35, 25);

                drawPixelRect(20, 40, 80, 40, '#8bac0f'); ctx.fillText("1. 서현", 40, 65);
                drawPixelRect(130, 40, 80, 40, '#8bac0f'); ctx.fillText("2. 야탑", 150, 65);
                drawPixelRect(20, 100, 80, 40, '#8bac0f'); ctx.fillText("3. 시내", 40, 125);
                drawPixelRect(130, 100, 80, 40, '#8bac0f'); ctx.fillText("4. 판교", 150, 125);

                drawCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 4:
                drawPixelRect(110, 110, 24, 24, '#304510');
                ctx.fillStyle = '#0f380f';
                ctx.font = '10px monospace';
                ctx.fillText("서희 놀이터", 95, 100);
                drawCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 5:
                drawPixelRect(10, 10, 220, 220, '#e0f8cf');
                ctx.fillStyle = '#304510';
                ctx.font = '10px monospace';
                ctx.fillText("❄️ 아이스링크장 ❄️", 70, 30);
                drawPixelRect(180, 110, 18, 18, '#0f380f'); // 패딩 아이콘
                drawCharacter(gameState.player.x, gameState.player.y, true);
                drawCharacter(gameState.partner.x, gameState.partner.y, false);
                break;

            case 6:
                ctx.fillStyle = '#0f380f';
                ctx.font = '12px monospace';
                ctx.fillText("🎉 진급을 축하합니다! 🎉", 35, 50);
                drawCharacter(100, 100, true);
                drawCharacter(120, 100, false);
                // 픽셀 폭죽
                drawPixelRect(30, 80, 5, 5, '#e91e63');
                drawPixelRect(200, 70, 6, 6, '#304510');
                drawPixelRect(60, 150, 4, 4, '#8bac0f');
                break;
        }

        requestAnimationFrame(render);
    }

    loadGame();
    render();
</script>
</body>
</html>
