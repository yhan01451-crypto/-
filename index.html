<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>두근두근 예민의 진급 스토리</title>
    <style>
        :root {
            --bg-color: #f7f0e3;
            --gb-body: #ffeaa7;
            --gb-border: #fdcb6e;
            --btn-pink: #ff7675;
            --btn-pink-dark: #d63031;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .gameboy-container {
            width: 100vw;
            max-width: 410px;
            height: 100vh;
            max-height: 840px;
            background: var(--gb-body);
            border-radius: 36px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px rgba(223, 180, 93, 0.4);
            border: 5px solid var(--gb-border);
        }

        .screen-frame {
            width: 100%;
            height: 56%;
            background: #6c5ce7;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .star-display {
            color: #ffeaa7;
            font-size: 15px;
            text-shadow: 1px 1px 2px #000;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        .dialog-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #ff7675;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text-color);
            font-weight: bold;
            line-height: 1.4;
            display: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            z-index: 30;
        }

        .dialog-next {
            text-align: right;
            font-size: 12px;
            color: #ff7675;
            margin-top: 6px;
            font-weight: 800;
        }

        .controller-area {
            width: 100%;
            height: 38%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 46px);
            grid-template-rows: repeat(3, 46px);
            gap: 2px;
        }

        .dpad-btn {
            background: #fab1a0;
            border: 2px solid #e17055;
            cursor: pointer;
            box-shadow: 0 4px 0 #e17055;
        }
        .dpad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #e17055;
        }

        .dpad-up { grid-column: 2; grid-row: 1; border-radius: 12px 12px 4px 4px; }
        .dpad-left { grid-column: 1; grid-row: 2; border-radius: 12px 4px 4px 12px; }
        .dpad-center { grid-column: 2; grid-row: 2; background: #fab1a0; box-shadow: none; border: none; }
        .dpad-right { grid-column: 3; grid-row: 2; border-radius: 4px 12px 12px 4px; }
        .dpad-down { grid-column: 2; grid-row: 3; border-radius: 4px 4px 12px 12px; }

        .btn-a-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-a {
            width: 80px;
            height: 80px;
            background: var(--btn-pink);
            border-radius: 50%;
            border: 3px solid var(--btn-pink-dark);
            color: white;
            font-size: 28px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 0 var(--btn-pink-dark);
            cursor: pointer;
        }

        .btn-a:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-pink-dark);
        }
    </style>
</head>
<body>

<div class="gameboy-container">
    <div class="screen-frame">
        <div class="screen-header">
            <span>ANIMAL BOY</span>
            <span>♥ D+509일 ♥</span>
            <span class="star-display" id="star-display">⭐ x 0</span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="280" height="280"></canvas>
            <div id="dialog" class="dialog-box">
                <div id="dialog-text">대화 내용이 출력됩니다.</div>
                <div class="dialog-next">[A 버튼을 누르세요]</div>
            </div>
        </div>
    </div>

    <div class="controller-area">
        <div class="dpad-grid">
            <div class="dpad-btn dpad-up" onclick="handleInput('UP')"></div>
            <div class="dpad-btn dpad-left" onclick="handleInput('LEFT')"></div>
            <div class="dpad-btn dpad-center"></div>
            <div class="dpad-btn dpad-right" onclick="handleInput('RIGHT')"></div>
            <div class="dpad-btn dpad-down" onclick="handleInput('DOWN')"></div>
        </div>
        <div class="btn-a-container">
            <div class="btn-a" onclick="handleInput('A')">A</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const dialogBox = document.getElementById('dialog');
    const dialogText = document.getElementById('dialog-text');
    const starDisplay = document.getElementById('star-display');

    let audioCtx = null;
    let bgmStarted = false;

    // 레트로 BGM 무한 재생 엔진
    function initBGM() {
        if (bgmStarted) return;
        bgmStarted = true;
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 동물의 숲 감성 멜로디 루프
        const notes = [
            261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66,
            261.63, 329.63, 392.00, 440.00, 392.00, 349.23, 329.63, 293.66
        ];
        let noteIdx = 0;

        function playLoop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);

            noteIdx = (noteIdx + 1) % notes.length;
            setTimeout(playLoop, 380);
        }
        playLoop();
    }

    function playSound(freq = 440, type = 'sine', duration = 0.08) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    let gameState = {
        stage: 0,
        stars: 0,
        player: { x: 120, y: 140, vx: 0, vy: 0 },
        partner: { x: 100, y: 140 },
        dialogIndex: 0,
        dialogList: [],
        popupItem: null,
        iceTracks: [],
        petals: Array.from({length: 15}, () => ({
            x: Math.random() * 280,
            y: Math.random() * 280,
            speed: 1 + Math.random() * 1.5
        })),
        shootingStar: { x: 0, y: 0, active: false }
    };

    function triggerPopup(itemType, callback) {
        gameState.popupItem = itemType;
        gameState.popupCallback = callback;
        playSound(660, 'sine', 0.2);
    }

    function updateStarDisplay() {
        starDisplay.innerText = `⭐ x ${gameState.stars}`;
    }

    function showDialog(lines, onComplete) {
        gameState.dialogList = lines;
        gameState.dialogIndex = 0;
        gameState.onDialogComplete = onComplete;
        dialogText.innerText = gameState.dialogList[0];
        dialogBox.style.display = 'block';
    }

    function handleInput(type) {
        // 첫 클릭 시 BGM 시작
        initBGM();
        playSound(type === 'A' ? 587 : 349);

        if (gameState.popupItem) {
            if (type === 'A') {
                gameState.popupItem = null;
                if (gameState.popupCallback) gameState.popupCallback();
            }
            return;
        }

        if (dialogBox.style.display === 'block') {
            if (type === 'A') {
                gameState.dialogIndex++;
                if (gameState.dialogIndex < gameState.dialogList.length) {
                    dialogText.innerText = gameState.dialogList[gameState.dialogIndex];
                } else {
                    dialogBox.style.display = 'none';
                    if (gameState.onDialogComplete) gameState.onDialogComplete();
                }
            }
            return;
        }

        switch(gameState.stage) {
            case 0:
                if (type === 'A') startStage1();
                break;
            case 1:
                if (type === 'A') {
                    gameState.player.x += 12;
                    if (gameState.player.x >= 180) finishStage1();
                }
                break;
            case 2:
                movePlayer(type);
                if (type === 'A') checkCabinetItem();
                break;
            case 3:
                movePlayer(type);
                if (type === 'A') checkQuizAnswer();
                break;
            case 4:
                movePlayer(type);
                if (type === 'A') checkPlayground();
                break;
            case 5:
                applyIceSlide(type);
                if (type === 'A') checkIceRink();
                break;
            case 6:
                if (type === 'A') advanceEnding();
                break;
        }
    }

    function movePlayer(type) {
        const speed = 14;
        if (type === 'UP' && gameState.player.y > 40) gameState.player.y -= speed;
        if (type === 'DOWN' && gameState.player.y < 230) gameState.player.y += speed;
        if (type === 'LEFT' && gameState.player.x > 30) gameState.player.x -= speed;
        if (type === 'RIGHT' && gameState.player.x < 230) gameState.player.x += speed;
    }

    function applyIceSlide(type) {
        const slidePower = 7;
        if (type === 'UP') gameState.player.vy = -slidePower;
        if (type === 'DOWN') gameState.player.vy = slidePower;
        if (type === 'LEFT') gameState.player.vx = -slidePower;
        if (type === 'RIGHT') gameState.player.vx = slidePower;
    }

    // --- STAGES ---
    function startStage1() {
        gameState.stage = 1;
        gameState.player = { x: 30, y: 130, vx: 0, vy: 0 };
        showDialog(["상병 진급 축하해 예민아! 🎖️", "예서와의 소중한 추억 별 5개를 모아봐!", "STAGE 1: A버튼을 마구 눌러 밤 한강의 오리배를 저어가자!"]);
    }

    function finishStage1() {
        triggerPopup('DUCKS', () => {
            gameState.stars = 1;
            updateStarDisplay();
            showDialog([
                "작년 한강 오리배 타던 밤 생각나?",
                "오빠가 불러준 노래 덕분에 너무 달콤했어 🎵",
                "⭐ 첫 번째 별 획득!"
            ], () => startStage2());
        });
    }

    function startStage2() {
        gameState.stage = 2;
        gameState.player = { x: 60, y: 190, vx: 0, vy: 0 };
        showDialog(["STAGE 2: 생활반 관물대 서랍에서 '김예민' 명찰을 찾아줘!"]);
    }

    function checkCabinetItem() {
        if (Math.abs(gameState.player.x - 210) < 30 && Math.abs(gameState.player.y - 100) < 30) {
            triggerPopup('NAME_TAG', () => {
                gameState.stars = 2;
                updateStarDisplay();
                showDialog(["빨간 바탕에 예쁘게 적힌 '김예민' 명찰 발견!", "⭐ 두 번째 별 획득!"], () => startStage3());
            });
        } else {
            showDialog(["관물대 서랍 속 커플 사진이 보여 💕 명찰은 어디 있을까?"]);
        }
    }

    function startStage3() {
        gameState.stage = 3;
        gameState.player = { x: 130, y: 220, vx: 0, vy: 0 };
        showDialog(["STAGE 3: 우리의 첫 데이트 장소 구름 표지판으로 이동해 A버튼을 눌러!"]);
    }

    function checkQuizAnswer() {
        if (gameState.player.x > 140 && gameState.player.y < 120) {
            triggerPopup('HEART', () => {
                gameState.stars = 3;
                updateStarDisplay();
                showDialog(["정답! 우리의 첫 데이트 장소는 '야탑'! 💖", "⭐ 세 번째 별 획득!"], () => startStage4());
            });
        } else {
            showDialog(["땡! 거기가 아니야~ 다시 생각해봐! 😜"]);
        }
    }

    function startStage4() {
        gameState.stage = 4;
        gameState.player = { x: 40, y: 200, vx: 0, vy: 0 };
        showDialog(["STAGE 4: 서희 놀이터 미끄럼틀 뒤에 숨어있는 예서를 찾아봐!"]);
    }

    function checkPlayground() {
        if (Math.abs(gameState.player.x - 190) < 35 && Math.abs(gameState.player.y - 120) < 35) {
            triggerPopup('PLAYGROUND', () => {
                gameState.stars = 4;
                updateStarDisplay();
                showDialog(["미끄럼틀 뒤에 빼꼼 숨어있던 예서 발견! 💕", "⭐ 네 번째 별 획득!"], () => startStage5());
            });
        }
    }

    function startStage5() {
        gameState.stage = 5;
        gameState.player = { x: 50, y: 140, vx: 0, vy: 0 };
        gameState.partner = { x: 30, y: 140 };
        showDialog(["STAGE 5: 미끄러운 빙판을 타고 손잡고 중앙으로 가자!"]);
    }

    function checkIceRink() {
        if (Math.abs(gameState.player.x - 200) < 35) {
            triggerPopup('ICE_RINK', () => {
                gameState.stars = 5;
                updateStarDisplay();
                showDialog([
                    "손 꼭 잡고 미끄러지던 아이스링크 데이트!",
                    "함께해서 너무 행복했어 ⛸️",
                    "⭐ 별 5개 모으기 성공!"
                ], () => startEnding());
            });
        }
    }

    function startEnding() {
        gameState.stage = 6;
        gameState.endingStep = 0;
        advanceEnding();
    }

    function advanceEnding() {
        const credits = [
            "9개월 동안 정말 고생 많았어!",
            "조금만 더 힘내서 멋지게 꽃길 걷자 🌸",
            "상병 진급 진심으로 축하해 예민아!",
            "✨ 너무너무 사랑해! ✨"
        ];
        if (gameState.endingStep < credits.length) {
            showDialog([credits[gameState.endingStep]]);
            gameState.endingStep++;
        } else {
            showDialog(["🎉 게임을 완수했습니다! 🎉", "[다시 하려면 새로고침을 해주세요]"]);
        }
    }

    // --- DRAWING FUNCTIONS ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function drawBigCharacter(x, y, isYemin = true) {
        drawPixelRect(x+4, y, 20, 8, isYemin ? '#2d3436' : '#6c5ce7');
        drawPixelRect(x+2, y+8, 24, 12, '#ffeaa7');
        drawPixelRect(x+6, y+12, 4, 4, '#2d3436');
        drawPixelRect(x+18, y+12, 4, 4, '#2d3436');
        drawPixelRect(x+3, y+15, 4, 2, '#ff7675');
        drawPixelRect(x+21, y+15, 4, 2, '#ff7675');
        drawPixelRect(x+12, y+16, 4, 2, '#d63031');
        drawPixelRect(x+2, y+20, 24, 12, isYemin ? '#00b894' : '#fd79a8');
        drawPixelRect(x+4, y+32, 7, 5, '#636e72');
        drawPixelRect(x+17, y+32, 7, 5, '#636e72');
    }

    function renderPopup() {
        if (!gameState.popupItem) return;

        drawPixelRect(0, 0, 280, 280, 'rgba(45, 52, 54, 0.7)');
        drawPixelRect(25, 30, 230, 200, '#ffffff');
        drawPixelRect(30, 35, 220, 190, '#ffeaa7');

        ctx.fillStyle = '#2d3436';
        ctx.font = 'bold 16px "Apple SD Gothic Neo", sans-serif';
        ctx.textAlign = 'center';

        if (gameState.popupItem === 'DUCKS') {
            ctx.fillText("✨ 한강 오리배 추억 ✨", 140, 70);
            drawPixelRect(100, 95, 80, 45, '#fdcb6e');
            drawPixelRect(160, 85, 20, 15, '#e17055');
            ctx.font = '13px "Apple SD Gothic Neo"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 140, 195);
        } else if (gameState.popupItem === 'NAME_TAG') {
            ctx.fillText("✨ 커플 명찰 ✨", 140, 70);
            drawPixelRect(60, 95, 160, 65, '#d63031');
            drawPixelRect(65, 100, 150, 55, '#ff7675');
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Apple SD Gothic Neo"';
            ctx.fillText("김 예 민", 140, 137);
            ctx.fillStyle = '#2d3436';
            ctx.font = '13px "Apple SD Gothic Neo"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 140, 195);
        } else if (gameState.popupItem === 'HEART') {
            ctx.fillText("💖 첫 데이트 야탑 💖", 140, 70);
            drawPixelRect(110, 95, 60, 50, '#ff7675');
            ctx.font = '13px "Apple SD Gothic Neo"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 140, 195);
        } else if (gameState.popupItem === 'PLAYGROUND') {
            ctx.fillText("🌙 서희 놀이터 추억 🌙", 140, 70);
            drawPixelRect(110, 95, 60, 50, '#74b9ff');
            ctx.font = '13px "Apple SD Gothic Neo"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 140, 195);
        } else if (gameState.popupItem === 'ICE_RINK') {
            ctx.fillText("⛸️ 아이스링크 데이트 ⛸️", 140, 70);
            drawPixelRect(110, 95, 60, 50, '#0984e3');
            ctx.font = '13px "Apple SD Gothic Neo"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 140, 195);
        }
        ctx.textAlign = 'left';
    }

    function render() {
        // 아이스링크 스케이트 궤적 남기기
        if (gameState.stage === 5) {
            if (Math.abs(gameState.player.vx) > 0.5 || Math.abs(gameState.player.vy) > 0.5) {
                gameState.iceTracks.push({x: gameState.player.x+12, y: gameState.player.y+30, alpha: 1.0});
            }

            gameState.player.x += gameState.player.vx;
            gameState.player.y += gameState.player.vy;
            gameState.player.vx *= 0.88;
            gameState.player.vy *= 0.88;

            if (gameState.player.x < 20) gameState.player.x = 20;
            if (gameState.player.x > 230) gameState.player.x = 230;
            if (gameState.player.y < 30) gameState.player.y = 30;
            if (gameState.player.y > 220) gameState.player.y = 220;

            gameState.partner.x = gameState.player.x - 24;
            gameState.partner.y = gameState.player.y;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        switch(gameState.stage) {
            case 0:
                drawPixelRect(0, 0, 280, 280, '#ffeaa7');
                ctx.fillStyle = '#2d3436';
                ctx.font = 'bold 20px "Apple SD Gothic Neo"';
                ctx.fillText("두근두근 예민의 진급", 50, 80);
                ctx.font = '15px "Apple SD Gothic Neo"';
                ctx.fillText("동물의 숲 감성 추억 여행 🍃", 55, 115);
                ctx.fillStyle = '#ff7675';
                ctx.font = 'bold 16px "Apple SD Gothic Neo"';
                ctx.fillText("[ A 버튼을 눌러 시작 ]", 65, 180);
                drawBigCharacter(120, 200, true);
                break;

            case 1:
                // 밤하늘 한강 + 유성 연출
                drawPixelRect(0, 0, 280, 140, '#2d3436');
                drawPixelRect(0, 140, 280, 140, '#0984e3');

                drawPixelRect(220, 20, 25, 25, '#ffeaa7');
                drawPixelRect(40, 30, 4, 4, '#ffffff');

                // 유성 애니메이션
                if (Math.random() < 0.05 && !gameState.shootingStar.active) {
                    gameState.shootingStar = { x: 50 + Math.random()*150, y: 10, active: true };
                }
                if (gameState.shootingStar.active) {
                    drawPixelRect(gameState.shootingStar.x, gameState.shootingStar.y, 12, 3, '#ffffff');
                    gameState.shootingStar.x += 6;
                    gameState.shootingStar.y += 3;
                    if (gameState.shootingStar.y > 100) gameState.shootingStar.active = false;
                }

                drawPixelRect(0, 120, 280, 20, '#636e72');
                drawPixelRect(50, 80, 15, 40, '#b2bec3');
                drawPixelRect(180, 80, 15, 40, '#b2bec3');

                drawPixelRect(gameState.player.x, gameState.player.y, 50, 28, '#fdcb6e');
                drawPixelRect(gameState.player.x+32, gameState.player.y-14, 18, 20, '#fdcb6e');
                drawPixelRect(gameState.player.x+46, gameState.player.y-6, 12, 8, '#e17055');
                drawBigCharacter(gameState.player.x+10, gameState.player.y-12, true);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Apple SD Gothic Neo"';
                ctx.fillText("A버튼 연타로 노 젓기! 🛶", 55, 30);
                break;

            case 2:
                drawPixelRect(0, 0, 280, 280, '#fab1a0');
                drawPixelRect(0, 160, 280, 120, '#e17055');

                drawPixelRect(30, 40, 65, 110, '#636e72');
                drawPixelRect(35, 45, 55, 100, '#b2bec3');

                // 폴라로이드 커플 사진 디테일
                drawPixelRect(42, 60, 40, 40, '#ffffff');
                drawPixelRect(47, 65, 30, 25, '#ff7675');

                drawPixelRect(180, 40, 65, 110, '#636e72');
                drawPixelRect(185, 45, 55, 100, '#b2bec3');
                drawPixelRect(190, 110, 45, 30, '#d63031');

                ctx.fillStyle = '#2d3436';
                ctx.font = 'bold 16px "Apple SD Gothic Neo"';
                ctx.fillText("[ 생활반 관물대 서랍 탐색 ]", 50, 30);

                drawBigCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 3:
                drawPixelRect(0, 0, 280, 280, '#74b9ff');
                drawPixelRect(0, 180, 280, 100, '#55efc4');

                ctx.fillStyle = '#2d3436';
                ctx.font = 'bold 16px "Apple SD Gothic Neo"';
                ctx.fillText("Q. 우리의 첫 데이트 장소는?", 40, 35);

                const drawCloudBtn = (x, y, text) => {
                    drawPixelRect(x, y, 100, 50, '#ffffff');
                    drawPixelRect(x+5, y+5, 90, 40, '#ffeaa7');
                    ctx.fillStyle = '#2d3436';
                    ctx.font = 'bold 15px "Apple SD Gothic Neo"';
                    ctx.fillText(text, x+20, y+30);
                };

                drawCloudBtn(20, 60, "1. 서현");
                drawCloudBtn(150, 60, "2. 야탑");
                drawCloudBtn(20, 120, "3. 시내");
                drawCloudBtn(150, 120, "4. 판교");

                drawBigCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 4:
                drawPixelRect(0, 0, 280, 280, '#2d3436');
                drawPixelRect(0, 200, 280, 80, '
                // 은은한 가로등 후광 조명 연출
                drawPixelRect(35, 120, 40, 80, 'rgba(255, 234, 167, 0.25)');
                drawPixelRect(50, 110, 10, 90, '#ffeaa7');

                drawPixelRect(150, 80, 15, 120, '#d63031');
                drawPixelRect(165, 110, 70, 90, '#fdcb6e');

                drawBigCharacter(195, 80, false);
                drawPixelRect(185, 75, 40, 120, 'rgba(253, 203, 110, 0.95)');

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Apple SD Gothic Neo"';
                ctx.fillText("미끄럼틀 뒤 예서를 찾아라! 🌙", 40, 35);

                drawBigCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 5:
                drawPixelRect(0, 0, 280, 280, '#81ecec');
                drawPixelRect(10, 10, 260, 260, '#74b9ff');
                drawPixelRect(20, 20, 240, 240, '#dfe6e9');

                // 스케이트 자국 렌더링
                gameState.iceTracks.forEach((t, i) => {
                    drawPixelRect(t.x, t.y, 4, 2, `rgba(255,255,255,${t.alpha})`);
                    t.alpha -= 0.005;
                });
                gameState.iceTracks = gameState.iceTracks.filter(t => t.alpha > 0);

                ctx.fillStyle = '#0984e3';
                ctx.font = 'bold 16px "Apple SD Gothic Neo"';
                ctx.fillText("⛸️ 미끄러지는 아이스링크장 ⛸️", 40, 45);

                drawPixelRect(190, 120, 60, 60, '#ff7675');
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px "Apple SD Gothic Neo"';
                ctx.fillText("목적지", 200, 155);

                drawBigCharacter(gameState.partner.x, gameState.partner.y, false);
                drawBigCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 6:
                drawPixelRect(0, 0, 280, 280, '#ffeaa7');
                ctx.fillStyle = '#d63031';
                ctx.font = 'bold 20px "Apple SD Gothic Neo"';
                ctx.fillText("🎉 진급을 축하합니다! 🎉", 40, 60);

                drawBigCharacter(90, 110, true);
                drawBigCharacter(130, 110, false);

                // 벚꽃잎 내리는 연출 🌸
                gameState.petals.forEach(p => {
                    drawPixelRect(p.x, p.y, 6, 6, '#fd79a8');
                    p.y += p.speed;
                    p.x += Math.sin(p.y / 10);
                    if (p.y > 280) { p.y = 0; p.x = Math.random() * 280; }
                });
                break;
        }

        renderPopup();
        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
