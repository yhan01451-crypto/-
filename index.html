<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>두근두근 예민의 진급 스토리</title>
    <!-- 귀여운 손글씨 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --gb-body: #ffeaa7;
            --gb-border: #fdcb6e;
            --btn-pink: #ff7675;
            --btn-pink-dark: #d63031;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Gamja Flower', 'Gowun Dodum', cursive, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #f7f0e3;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .gameboy-container {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 920px;
            background: var(--gb-body);
            border-radius: 28px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid var(--gb-border);
        }

        .screen-frame {
            width: 100%;
            height: 62%;
            background: #4a47a3;
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .star-display {
            color: #ffeaa7;
            font-size: 17px;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 손글씨 대화창 */
        .dialog-box {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            background: rgba(255, 255, 255, 0.96);
            border: 3px solid #ff7675;
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 18px;
            color: #2d3436;
            line-height: 1.3;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 30;
        }

        .dialog-next {
            text-align: right;
            font-size: 14px;
            color: #ff7675;
            margin-top: 4px;
            font-weight: bold;
        }

        .controller-area {
            width: 100%;
            height: 34%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 0;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 3px;
        }

        .dpad-btn {
            background: #fab1a0;
            border: 2px solid #e17055;
            cursor: pointer;
            box-shadow: 0 4px 0 #e17055;
        }
        .dpad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #e17055;
        }

        .dpad-up { grid-column: 2; grid-row: 1; border-radius: 14px 14px 4px 4px; }
        .dpad-left { grid-column: 1; grid-row: 2; border-radius: 14px 4px 4px 14px; }
        .dpad-center { grid-column: 2; grid-row: 2; background: #fab1a0; box-shadow: none; border: none; }
        .dpad-right { grid-column: 3; grid-row: 2; border-radius: 4px 14px 14px 4px; }
        .dpad-down { grid-column: 2; grid-row: 3; border-radius: 4px 4px 14px 14px; }

        .btn-a-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-a {
            width: 85px;
            height: 85px;
            background: var(--btn-pink);
            border-radius: 50%;
            border: 4px solid var(--btn-pink-dark);
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 0 var(--btn-pink-dark);
            cursor: pointer;
        }

        .btn-a:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-pink-dark);
        }
    </style>
</head>
<body>

<div class="gameboy-container">
    <div class="screen-frame">
        <div class="screen-header">
            <span>ANIMAL BOY</span>
            <span>♥ D+509일 ♥</span>
            <span class="star-display" id="star-display">⭐ x 0</span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="300" height="300"></canvas>
            <div id="dialog" class="dialog-box">
                <div id="dialog-text">대화 내용이 출력됩니다.</div>
                <div class="dialog-next">[ A 버튼 누르기 ]</div>
            </div>
        </div>
    </div>

    <div class="controller-area">
        <div class="dpad-grid">
            <div class="dpad-btn dpad-up" onclick="handleInput('UP')"></div>
            <div class="dpad-btn dpad-left" onclick="handleInput('LEFT')"></div>
            <div class="dpad-btn dpad-center"></div>
            <div class="dpad-btn dpad-right" onclick="handleInput('RIGHT')"></div>
            <div class="dpad-btn dpad-down" onclick="handleInput('DOWN')"></div>
        </div>
        <div class="btn-a-container">
            <div class="btn-a" onclick="handleInput('A')">A</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const dialogBox = document.getElementById('dialog');
    const dialogText = document.getElementById('dialog-text');
    const starDisplay = document.getElementById('star-display');

    let audioCtx = null;
    let bgmStarted = false;

    function initBGM() {
        if (bgmStarted) return;
        bgmStarted = true;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66];
        let noteIdx = 0;

        function playLoop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
            noteIdx = (noteIdx + 1) % notes.length;
            setTimeout(playLoop, 380);
        }
        playLoop();
    }

    function playSound(freq = 440) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    let gameState = {
        stage: 0,
        stars: 0,
        player: { x: 130, y: 150, vx: 0, vy: 0 },
        partner: { x: 110, y: 150 },
        dialogIndex: 0,
        dialogList: [],
        popupItem: null,
        iceTracks: [],
        petals: Array.from({length: 18}, () => ({
            x: Math.random() * 300, y: Math.random() * 300, speed: 1 + Math.random() * 1.5
        })),
        shootingStar: { x: 0, y: 0, active: false },
        
        // 스테이지 전환 애니메이션 상태
        transitionAlpha: 0,
        transitioning: false,
        transitionCallback: null,

        // 엔딩 추억 앨범 슬라이드 쇼 관련 상태
        albumIndex: 0,
        albumTimer: 0
    };

    function startStageTransition(onMidpoint) {
        if (gameState.transitioning) return;
        gameState.transitioning = true;
        gameState.transitionAlpha = 0;
        gameState.transitionCallback = onMidpoint;
    }

    function updateTransition() {
        if (!gameState.transitioning) return;

        if (gameState.transitionCallback) {
            // Fade Out
            gameState.transitionAlpha += 0.05;
            if (gameState.transitionAlpha >= 1) {
                gameState.transitionAlpha = 1;
                gameState.transitionCallback();
                gameState.transitionCallback = null;
            }
        } else {
            // Fade In
            gameState.transitionAlpha -= 0.05;
            if (gameState.transitionAlpha <= 0) {
                gameState.transitionAlpha = 0;
                gameState.transitioning = false;
            }
        }
    }

    function drawTransition() {
        if (gameState.transitionAlpha <= 0) return;
        ctx.fillStyle = `rgba(30, 41, 59, ${gameState.transitionAlpha})`;
        ctx.fillRect(0, 0, 300, 300);

        // 동물의 숲 상징 초록색 나뭇잎 효과
        ctx.save();
        ctx.globalAlpha = gameState.transitionAlpha;
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.ellipse(150, 150, 24, 12, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function triggerPopup(itemType, callback) {
        gameState.popupItem = itemType;
        gameState.popupCallback = callback;
        playSound(660);
    }

    function updateStarDisplay() {
        starDisplay.innerText = `⭐ x ${gameState.stars}`;
    }

    function showDialog(lines, onComplete) {
        gameState.dialogList = lines;
        gameState.dialogIndex = 0;
        gameState.onDialogComplete = onComplete;
        dialogText.innerText = gameState.dialogList[0];
        dialogBox.style.display = 'block';
    }

    function handleInput(type) {
        initBGM();
        playSound(type === 'A' ? 587 : 349);

        if (gameState.transitioning) return;

        if (gameState.popupItem) {
            if (type === 'A') {
                gameState.popupItem = null;
                if (gameState.popupCallback) gameState.popupCallback();
            }
            return;
        }

        if (dialogBox.style.display === 'block') {
            if (type === 'A') {
                gameState.dialogIndex++;
                if (gameState.dialogIndex < gameState.dialogList.length) {
                    dialogText.innerText = gameState.dialogList[gameState.dialogIndex];
                } else {
                    dialogBox.style.display = 'none';
                    if (gameState.onDialogComplete) gameState.onDialogComplete();
                }
            }
            return;
        }

        switch(gameState.stage) {
            case 0:
                if (type === 'A') {
                    startStageTransition(() => startStage1());
                }
                break;
            case 1:
                if (type === 'A') {
                    gameState.player.x += 12;
                    if (gameState.player.x >= 200) finishStage1();
                }
                break;
            case 2:
                movePlayer(type);
                if (type === 'A') checkCabinetItem();
                break;
            case 3:
                movePlayer(type);
                if (type === 'A') checkQuizAnswer();
                break;
            case 4:
                movePlayer(type);
                if (type === 'A') checkPlayground();
                break;
            case 5:
                applyIceSlide(type);
                if (type === 'A') checkIceRink();
                break;
            case 6:
                if (type === 'A') advanceEnding();
                break;
        }
    }

    function movePlayer(type) {
        const speed = 14;
        if (type === 'UP' && gameState.player.y > 50) gameState.player.y -= speed;
        if (type === 'DOWN' && gameState.player.y < 240) gameState.player.y += speed;
        if (type === 'LEFT' && gameState.player.x > 30) gameState.player.x -= speed;
        if (type === 'RIGHT' && gameState.player.x < 250) gameState.player.x += speed;
    }

    function applyIceSlide(type) {
        const slidePower = 7;
        if (type === 'UP') gameState.player.vy = -slidePower;
        if (type === 'DOWN') gameState.player.vy = slidePower;
        if (type === 'LEFT') gameState.player.vx = -slidePower;
        if (type === 'RIGHT') gameState.player.vx = slidePower;
    }

    // --- STAGES ---
    function startStage1() {
        gameState.stage = 1;
        gameState.player = { x: 30, y: 160, vx: 0, vy: 0 };
        showDialog(["상병 진급 정말 축하해 예민아! 🎖️", "예서와의 추억 별 5개를 모두 찾아보자!", "STAGE 1: A버튼을 눌러 밤 한강의 오리배를 저어가자!"]);
    }

    function finishStage1() {
        triggerPopup('DUCKS', () => {
            gameState.stars = 1;
            updateStarDisplay();
            showDialog([
                "작년 한강 오리배 타던 아름다운 밤 생각나?",
                "오빠가 불러준 노래 덕분에 너무 달콤했어 🎵",
                "⭐ 첫 번째 추억 별 획득!"
            ], () => {
                startStageTransition(() => startStage2());
            });
        });
    }

    function startStage2() {
        gameState.stage = 2;
        gameState.player = { x: 50, y: 210, vx: 0, vy: 0 };
        showDialog(["STAGE 2: 생활반 관물대 서랍에서 '김예민' 명찰을 찾아줘!"]);
    }

    function checkCabinetItem() {
        if (Math.abs(gameState.player.x - 220) < 40 && Math.abs(gameState.player.y - 120) < 40) {
            triggerPopup('NAME_TAG', () => {
                gameState.stars = 2;
                updateStarDisplay();
                showDialog(["선명한 빨간 바탕에 예쁜 '김예민' 명찰 발견!", "⭐ 두 번째 추억 별 획득!"], () => {
                    startStageTransition(() => startStage3());
                });
            });
        } else {
            showDialog(["관물대에 걸린 롱패딩과 군복, 에어팟이 보여! 명찰 서랍을 열어보자."]);
        }
    }

    function startStage3() {
        gameState.stage = 3;
        gameState.player = { x: 140, y: 230, vx: 0, vy: 0 };
        showDialog(["STAGE 3: 우리의 첫 데이트 장소 구름 표지판으로 가보자!"]);
    }

    function checkQuizAnswer() {
        if (gameState.player.x > 150 && gameState.player.y < 130) {
            triggerPopup('HEART', () => {
                gameState.stars = 3;
                updateStarDisplay();
                showDialog(["정답! 우리의 설레는 첫 데이트 장소는 '야탑'! 💖", "⭐ 세 번째 추억 별 획득!"], () => {
                    startStageTransition(() => startStage4());
                });
            });
        } else {
            showDialog(["땡! 거기가 아니야~ 다시 잘 생각해봐! 😜"]);
        }
    }

    function startStage4() {
        gameState.stage = 4;
        gameState.player = { x: 40, y: 220, vx: 0, vy: 0 };
        showDialog(["STAGE 4: 서희 놀이터 미끄럼틀 기둥 뒤에 꼭꼭 숨은 예서를 찾아봐!"]);
    }

    function checkPlayground() {
        if (Math.abs(gameState.player.x - 215) < 30 && Math.abs(gameState.player.y - 120) < 30) {
            triggerPopup('PLAYGROUND', () => {
                gameState.stars = 4;
                updateStarDisplay();
                showDialog(["미끄럼틀 기둥 뒤에 몰래 숨어있던 예서 발견! 💕", "⭐ 네 번째 추억 별 획득!"], () => {
                    startStageTransition(() => startStage5());
                });
            });
        } else {
            showDialog(["여긴 안 보여! 미끄럼틀 오른쪽 뒤편을 유심히 봐봐!"]);
        }
    }

    function startStage5() {
        gameState.stage = 5;
        gameState.player = { x: 50, y: 150, vx: 0, vy: 0 };
        gameState.partner = { x: 30, y: 150 };
        showDialog(["STAGE 5: 미끄러운 빙판을 타고 손잡고 하트 지점으로 가자!"]);
    }

    function checkIceRink() {
        if (Math.abs(gameState.player.x - 220) < 35) {
            triggerPopup('ICE_RINK', () => {
                gameState.stars = 5;
                updateStarDisplay();
                showDialog([
                    "손 꼭 잡고 즐겁게 미끄러지던 아이스링크 데이트!",
                    "함께여서 매 순간이 정말 행복했어 ⛸️",
                    "⭐ 별 5개 모두 찾기 성공!"
                ], () => {
                    startStageTransition(() => startEnding());
                });
            });
        }
    }

    function startEnding() {
        gameState.stage = 6;
        gameState.endingStep = 0;
        gameState.albumIndex = 0;
        gameState.albumTimer = 0;
        advanceEnding();
    }

    function advanceEnding() {
        const credits = [
            "9개월 동안 국방의 의무 다하느라 고생 많았어!",
            "조금만 더 힘내서 다치지 말고 멋지게 꽃길 걷자 🌸",
            "상병 진급을 진심으로 너무너무 축하해 예민아!",
            "✨ 세상에서 제일 사랑해! ✨"
        ];
        if (gameState.endingStep < credits.length) {
            showDialog([credits[gameState.endingStep]]);
            gameState.endingStep++;
        } else {
            showDialog(["🎉 축하합니다! 상병 진급 엔딩! 🎉", "[ 다시 하려면 새로고침을 해주세요 ]"]);
        }
    }

    // --- DRAWING FUNCTIONS ---

    function drawDetailedCharacter(x, y, isYemin = true) {
        ctx.save();
        if (isYemin) {
            ctx.fillStyle = '#2d3436';
            ctx.beginPath();
            ctx.ellipse(x+15, y+5, 14, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath();
            ctx.arc(x+15, y+14, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2d3436';
            ctx.fillRect(x+10, y+12, 3, 3);
            ctx.fillRect(x+17, y+12, 3, 3);
            ctx.fillStyle = '#ff7675';
            ctx.fillRect(x+8, y+15, 3, 2);
            ctx.fillRect(x+19, y+15, 3, 2);

            ctx.fillStyle = '#00b894';
            ctx.fillRect(x+6, y+24, 18, 14);
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(x+8, y+26, 4, 4);
            ctx.fillRect(x+16, y+30, 5, 4);
            ctx.fillStyle = '#636e72';
            ctx.fillRect(x+12, y+28, 4, 3);

            ctx.fillStyle = '#2d3436';
            ctx.fillRect(x+7, y+38, 6, 5);
            ctx.fillRect(x+17, y+38, 6, 5);
        } else {
            ctx.fillStyle = '#fd79a8';
            ctx.fillRect(x+5, y+3, 20, 3);

            ctx.fillStyle = '#6c5ce7';
            ctx.beginPath();
            ctx.arc(x+15, y+12, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath();
            ctx.arc(x+15, y+14, 9, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2d3436';
            ctx.fillRect(x+10, y+13, 3, 3);
            ctx.fillRect(x+17, y+13, 3, 3);
            ctx.fillStyle = '#ff7675';
            ctx.fillRect(x+7, y+16, 4, 2);
            ctx.fillRect(x+19, y+16, 4, 2);

            ctx.fillStyle = '#ff7675';
            ctx.beginPath();
            ctx.moveTo(x+15, y+23);
            ctx.lineTo(x+4, y+37);
            ctx.lineTo(x+26, y+37);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#d63031';
            ctx.fillRect(x+8, y+37, 5, 4);
            ctx.fillRect(x+17, y+37, 5, 4);
        }
        ctx.restore();
    }

    // 엔딩 앨범 슬라이드 쇼 랜더링
    function renderAlbumSlideshow() {
        const albumItems = [
            { title: "1. 한강 오리배 🛶", icon: "🛶", color: "#60a5fa" },
            { title: "2. 빨간 명찰 🏷️", icon: "🏷️", color: "#f87171" },
            { title: "3. 첫 데이트 야탑 💖", icon: "💖", color: "#f472b6" },
            { title: "4. 서희 놀이터 🛝", icon: "🛝", color: "#fbbf24" },
            { title: "5. 아이스링크 ⛸️", icon: "⛸️", color: "#38bdf8" }
        ];

        gameState.albumTimer++;
        if (gameState.albumTimer > 180) { // 약 3초마다 슬라이드 전환
            gameState.albumTimer = 0;
            gameState.albumIndex = (gameState.albumIndex + 1) % albumItems.length;
        }

        const current = albumItems[gameState.albumIndex];

        // 폴라로이드 사진 프레임
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.15)';
        ctx.shadowBlur = 8;
        ctx.fillRect(60, 110, 180, 140);
        ctx.shadowBlur = 0;

        // 사진 속 배경
        ctx.fillStyle = current.color;
        ctx.fillRect(70, 120, 160, 95);

        // 사진 아이콘
        ctx.font = '40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(current.icon, 150, 180);

        // 폴라로이드 하단 타이틀
        ctx.fillStyle = '#2d3436';
        ctx.font = '16px "Gamja Flower"';
        ctx.fillText(current.title, 150, 236);
        ctx.textAlign = 'left';
    }

    function renderPopup() {
        if (!gameState.popupItem) return;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, 300, 300);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(20, 30, 260, 220);
        ctx.fillStyle = '#fff9e6';
        ctx.fillRect(25, 35, 250, 210);
        ctx.strokeStyle = '#ff7675';
        ctx.lineWidth = 4;
        ctx.strokeRect(25, 35, 250, 210);

        ctx.fillStyle = '#2d3436';
        ctx.font = '22px "Gamja Flower"';
        ctx.textAlign = 'center';

        if (gameState.popupItem === 'DUCKS') {
            ctx.fillText("✨ 한강 오리배 추억 ✨", 150, 70);
            ctx.fillStyle = '#fdcb6e';
            ctx.beginPath();
            ctx.arc(150, 120, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e17055';
            ctx.fillRect(165, 115, 15, 10);
            ctx.fillStyle = '#2d3436';
            ctx.font = '16px "Gowun Dodum"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 150, 215);
        } else if (gameState.popupItem === 'NAME_TAG') {
            ctx.fillText("✨ 커스텀 빨간 명찰 ✨", 150, 70);
            ctx.fillStyle = '#d63031';
            ctx.fillRect(65, 100, 170, 70);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(70, 105, 160, 60);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px "Gowun Dodum"';
            ctx.fillText("김 예 민", 150, 145);
            ctx.fillStyle = '#2d3436';
            ctx.font = '16px "Gowun Dodum"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 150, 215);
        } else if (gameState.popupItem === 'HEART') {
            ctx.fillText("💖 첫 데이트 야탑 💖", 150, 70);
            ctx.fillStyle = '#ff7675';
            ctx.font = '50px sans-serif';
            ctx.fillText("💖", 150, 140);
            ctx.fillStyle = '#2d3436';
            ctx.font = '16px "Gowun Dodum"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 150, 215);
        } else if (gameState.popupItem === 'PLAYGROUND') {
            ctx.fillText("🌙 서희 놀이터 추억 🌙", 150, 70);
            ctx.fillStyle = '#74b9ff';
            ctx.font = '50px sans-serif';
            ctx.fillText("🛝", 150, 140);
            ctx.fillStyle = '#2d3436';
            ctx.font = '16px "Gowun Dodum"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 150, 215);
        } else if (gameState.popupItem === 'ICE_RINK') {
            ctx.fillText("⛸️ 아이스링크 데이트 ⛸️", 150, 70);
            ctx.fillStyle = '#0984e3';
            ctx.font = '50px sans-serif';
            ctx.fillText("⛸️", 150, 140);
            ctx.fillStyle = '#2d3436';
            ctx.font = '16px "Gowun Dodum"';
            ctx.fillText("[ A 버튼을 눌러 계속 ]", 150, 215);
        }
        ctx.textAlign = 'left';
    }

    function render() {
        updateTransition();

        if (gameState.stage === 5) {
            if (Math.abs(gameState.player.vx) > 0.5 || Math.abs(gameState.player.vy) > 0.5) {
                gameState.iceTracks.push({x: gameState.player.x+15, y: gameState.player.y+35, alpha: 1.0});
            }

            gameState.player.x += gameState.player.vx;
            gameState.player.y += gameState.player.vy;
            gameState.player.vx *= 0.88;
            gameState.player.vy *= 0.88;

            if (gameState.player.x < 20) gameState.player.x = 20;
            if (gameState.player.x > 250) gameState.player.x = 250;
            if (gameState.player.y < 40) gameState.player.y = 40;
            if (gameState.player.y > 240) gameState.player.y = 240;

            gameState.partner.x = gameState.player.x - 22;
            gameState.partner.y = gameState.player.y;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        switch(gameState.stage) {
            case 0:
                ctx.fillStyle = '#ffeaa7';
                ctx.fillRect(0, 0, 300, 300);
                ctx.fillStyle = '#2d3436';
                ctx.font = 'bold 26px "Gamja Flower"';
                ctx.fillText("두근두근 예민의 진급", 60, 85);
                ctx.font = '20px "Gamja Flower"';
                ctx.fillText("동물의 숲 감성 추억 여행 🍃", 65, 120);
                ctx.fillStyle = '#ff7675';
                ctx.font = 'bold 20px "Gamja Flower"';
                ctx.fillText("[ A 버튼을 눌러 시작 ]", 75, 185);
                drawDetailedCharacter(135, 210, true);
                break;

            case 1:
                let skyGrad = ctx.createLinearGradient(0, 0, 0, 160);
                skyGrad.addColorStop(0, '#1e1b4b');
                skyGrad.addColorStop(1, '#312e81');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, 300, 160);

                let riverGrad = ctx.createLinearGradient(0, 160, 0, 300);
                riverGrad.addColorStop(0, '#1e40af');
                riverGrad.addColorStop(1, '#1e3a8a');
                ctx.fillStyle = riverGrad;
                ctx.fillRect(0, 160, 300, 140);

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(240, 35, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(40, 30, 3, 3);
                ctx.fillRect(110, 20, 2, 2);
                ctx.fillRect(180, 50, 3, 3);

                if (Math.random() < 0.05 && !gameState.shootingStar.active) {
                    gameState.shootingStar = { x: 40 + Math.random()*160, y: 10, active: true };
                }
                if (gameState.shootingStar.active) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(gameState.shootingStar.x, gameState.shootingStar.y);
                    ctx.lineTo(gameState.shootingStar.x + 15, gameState.shootingStar.y + 10);
                    ctx.stroke();
                    gameState.shootingStar.x += 6;
                    gameState.shootingStar.y += 4;
                    if (gameState.shootingStar.y > 100) gameState.shootingStar.active = false;
                }

                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 4;
                ctx.strokeRect(-10, 140, 320, 20);
                ctx.beginPath();
                ctx.moveTo(30, 140); ctx.lineTo(60, 100); ctx.lineTo(90, 140);
                ctx.moveTo(150, 140); ctx.lineTo(180, 100); ctx.lineTo(210, 140);
                ctx.stroke();

                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(gameState.player.x+20, gameState.player.y+15, 20, 0, Math.PI);
                ctx.fill();
                ctx.fillRect(gameState.player.x+25, gameState.player.y-5, 14, 20);
                ctx.fillStyle = '#f97316';
                ctx.fillRect(gameState.player.x+39, gameState.player.y, 10, 8);

                drawDetailedCharacter(gameState.player.x+5, gameState.player.y-10, true);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px "Gamja Flower"';
                ctx.fillText("A버튼 연타로 밤 한강 노젓기! 🛶", 55, 30);
                break;

            case 2:
                ctx.fillStyle = '#fef3c7';
                ctx.fillRect(0, 0, 300, 170);
                ctx.fillStyle = '#b45309';
                ctx.fillRect(0, 170, 300, 130);

                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 1;
                for(let i=170; i<300; i+=25) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(300, i); ctx.stroke();
                }

                ctx.fillStyle = '#475569';
                ctx.fillRect(20, 30, 80, 130);
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(25, 35, 70, 120);

                ctx.fillStyle = '#475569';
                ctx.fillRect(190, 30, 80, 130);
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(195, 35, 70, 120);

                ctx.fillStyle = '#0f172a';
                ctx.fillRect(35, 55, 22, 50);
                ctx.fillStyle = '#15803d';
                ctx.fillRect(62, 55, 22, 45);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(205, 50, 12, 10);
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(208, 52, 6, 3);

                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(225, 45, 25, 20);
                ctx.fillStyle = '#f43f5e';
                ctx.font = '10px sans-serif';
                ctx.fillText("♥", 233, 58);

                ctx.fillStyle = '#dc2626';
                ctx.fillRect(200, 115, 60, 30);
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px "Gowun Dodum"';
                ctx.fillText("명찰함", 212, 134);

                ctx.fillStyle = '#1e293b';
                ctx.font = '20px "Gamja Flower"';
                ctx.fillText("[ 관물대 서랍 탐색 ]", 85, 25);

                drawDetailedCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 3:
                let sky3 = ctx.createLinearGradient(0, 0, 0, 300);
                sky3.addColorStop(0, '#38bdf8');
                sky3.addColorStop(1, '#bae6fd');
                ctx.fillStyle = sky3;
                ctx.fillRect(0, 0, 300, 300);

                ctx.fillStyle = '#4ade80';
                ctx.fillRect(0, 190, 300, 110);

                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 20px "Gamja Flower"';
                ctx.fillText("Q. 우리의 첫 데이트 장소는?", 50, 35);

                const drawCloudBtn = (x, y, text) => {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(x+20, y+20, 20, 0, Math.PI*2);
                    ctx.arc(x+50, y+15, 25, 0, Math.PI*2);
                    ctx.arc(x+80, y+20, 20, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 18px "Gamja Flower"';
                    ctx.fillText(text, x+25, y+25);
                };

                drawCloudBtn(20, 60, "1. 서현");
                drawCloudBtn(160, 60, "2. 야탑");
                drawCloudBtn(20, 125, "3. 시내");
                drawCloudBtn(160, 125, "4. 판교");

                drawDetailedCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 4:
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, 300, 300);
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(0, 210, 300, 90);

                ctx.fillStyle = 'rgba(254, 240, 138, 0.2)';
                ctx.beginPath();
                ctx.arc(50, 120, 50, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(45, 110, 10, 100);

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(215, 60); ctx.lineTo(170, 90); ctx.lineTo(260, 90); ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(180, 90, 70, 120);

                drawDetailedCharacter(218, 90, false);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(205, 85, 22, 125); 

                ctx.fillStyle = '#3b82f6';
                ctx.beginPath();
                ctx.moveTo(180, 130); ctx.lineTo(130, 210); ctx.lineTo(150, 210); ctx.lineTo(195, 130); ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px "Gamja Flower"';
                ctx.fillText("미끄럼틀 기둥 뒤 예서를 찾아라! 🌙", 35, 30);

                drawDetailedCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 5:
                let iceGrad = ctx.createLinearGradient(0, 0, 300, 300);
                iceGrad.addColorStop(0, '#a5f3fc');
                iceGrad.addColorStop(1, '#38bdf8');
                ctx.fillStyle = iceGrad;
                ctx.fillRect(0, 0, 300, 300);

                gameState.iceTracks.forEach((t) => {
                    ctx.fillStyle = `rgba(255,255,255,${t.alpha})`;
                    ctx.fillRect(t.x, t.y, 4, 3);
                    t.alpha -= 0.006;
                });
                gameState.iceTracks = gameState.iceTracks.filter(t => t.alpha > 0);

                ctx.fillStyle = '#0369a1';
                ctx.font = 'bold 20px "Gamja Flower"';
                ctx.fillText("⛸️ 미끄러지는 아이스링크장 ⛸️", 50, 40);

                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc(220, 150, 25, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px "Gamja Flower"';
                ctx.fillText("목적지", 202, 155);

                drawDetailedCharacter(gameState.partner.x, gameState.partner.y, false);
                drawDetailedCharacter(gameState.player.x, gameState.player.y, true);
                break;

            case 6:
                // 엔딩 화면
                ctx.fillStyle = '#fef3c7';
                ctx.fillRect(0, 0, 300, 300);
                ctx.fillStyle = '#dc2626';
                ctx.font = 'bold 22px "Gamja Flower"';
                ctx.fillText("🎉 상병 진급 축하 미니 앨범 🎉", 25, 35);

                // 추억 앨범 슬라이드쇼 랜더링
                renderAlbumSlideshow();

                // 캐릭터 나란히 배치
                drawDetailedCharacter(100, 50, true);
                drawDetailedCharacter(170, 50, false);

                // 벚꽃잎 애니메이션
                gameState.petals.forEach(p => {
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                    ctx.fill();
                    p.y += p.speed;
                    p.x += Math.sin(p.y / 12);
                    if (p.y > 300) { p.y = 0; p.x = Math.random() * 300; }
                });
                break;
        }

        renderPopup();
        drawTransition();
        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
